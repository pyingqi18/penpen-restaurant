    </section>
    <section id="invent" class="screen modal">
      <div class="card" style="min-width:760px">
        <div id="inv-idea" class="inv-idea"></div>
        <h3>选一样食材</h3><div id="inv-ings" class="inv-row"></div>
        <h3>选一件炊具</h3><div id="inv-wares" class="inv-row"></div>
        <div id="inv-res"></div>
        <div class="inv-btns"><button id="inv-go" class="big">试一试（用掉 1 份）</button><button id="inv-ok">先不试了</button></div>
      </div>
    </section>
    <section id="staff" class="screen modal">
      <div class="card" style="min-width:640px">
        <h2>安排店员</h2>
        <p class="goal">店员会按安排自己干活；随时可以换。</p>
        <div id="staff-list"></div>
        <button class="primary" id="staff-ok">好了，继续营业</button>
      </div>
    </section>

    <section id="away" class="screen modal">
      <div class="card" style="max-width:720px">
        <h2>你不在的时候……</h2>
        <div id="away-body"></div>
        <button class="primary" id="away-ok">好的，开始营业</button>
      </div>
    </section>

    <section id="result" class="screen modal">
      <div class="card res-card">
        <div class="res-left">
          <h2>今天打烊啦</h2>
          <div id="res-body"></div>
        </div>
        <div class="res-right">
          <div id="res-shop"></div>
          <button class="primary" id="b-next">开始下一天</button>
          <button id="b-home">回到存档列表</button>
        </div>
      </div>
    </section>

    <div id="plot" class="modal" role="dialog" aria-modal="true" aria-label="菜地"><div class="pbox"><h3>菜地 <small id="plot-no"></small></h3><div class="pmain"><div id="plot-grid"></div><div class="pside"><p class="plbl">选种子</p><div id="plot-seeds"></div><p id="plot-tip"></p><button id="plot-fill">种满</button><button id="plot-harvest">收菜</button><button id="plot-ok">好了</button></div></div></div></div>
    <div id="choose" class="modal" role="dialog" aria-modal="true"><div class="cbox"><h3></h3><div class="opts"></div><button class="no">算了</button></div></div>
    <div id="ask" class="modal" role="alertdialog" aria-modal="true">
      <div class="card"><p style="font-size:24px;margin:0;text-align:center;line-height:1.5"></p>
        <button class="yes primary"></button><button class="no">取消</button></div>
    </div>
    <div id="toast" role="status"></div>
  </div>
</div>
<div id="rotate"><div class="phone">📱</div><p>请把手机横过来玩～</p></div>
